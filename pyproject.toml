[project]
name = "cu-agent-audit"
version = "0.2.0"
description = "Claude Code session analysis API, detectors and grounded ML review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "cu-agent-review",
    "fastapi>=0.125.0",
    "greenlet>=3.3.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.38.0",
]

[tool.uv.sources]
cu-agent-review = { path = "ml", editable = true }
