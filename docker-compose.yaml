services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5432 на хосте часто занят другим проектом, поэтому наружу отдаём 5433
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
    image: backend
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB__URL: "postgresql+asyncpg://postgres:postgres@db:5432/postgres"
      DB__ECHO: 0
      STORAGE__DATA_DIR: "/app/data"
    ports:
      - "8080:8080"
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
  app_data:
